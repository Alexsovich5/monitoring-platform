name: monitoring-platform

services:
  app:
    build: .
    image: monitoring-platform:app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - zabbix

  collector:
    image: monitoring-platform:app
    command: ["mpctl", "collect", "--interval", "30"]
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - zabbix

  snmpsim:
    image: monitoring-platform:app
    # snmpsim drops to nobody before binding, so it listens on UDP 1161.
    command: ["snmpsimd.py", "--data-dir=/data",
              "--agent-udpv4-endpoint=0.0.0.0:1161",
              "--process-user=nobody", "--process-group=nogroup"]
    volumes:
      - .:/app
      - ./docker/snmpsim/data:/data:ro
    working_dir: /app
    restart: unless-stopped

  api:
    image: monitoring-platform:app
    command: ["gunicorn", "-b", "0.0.0.0:5000", "-w", "2",
              "monplat.api.app:create_app()"]
    volumes:
      - .:/app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "20750:5000"

  grafana:
    build: docker/grafana
    image: monitoring-platform:grafana
    platform: linux/amd64
    volumes:
      - ./grafana/dashboards:/grafana/src/app/dashboards:ro
    restart: unless-stopped
    ports:
      - "20730:3000"

  db:
    image: postgres:9.3
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
      - dbdata:/var/lib/postgresql/data

  zabbix:
    build: docker/zabbix
    image: monitoring-platform:zabbix
    platform: linux/amd64
    depends_on:
      - db
    ports:
      - "20780:80"
      - "20751:10051"

volumes:
  dbdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.47.0.0/24
