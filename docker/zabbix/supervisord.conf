[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[inet_http_server]
; read by the integration tests over XML-RPC; only reachable on the
; compose network, the port is not published
port=0.0.0.0:9001

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:zabbix_server]
command=/usr/local/bin/run-daemon.sh /usr/sbin/zabbix_server /etc/zabbix/zabbix_server.conf /var/run/zabbix/zabbix_server.pid
startsecs=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:zabbix_agentd]
command=/usr/local/bin/run-daemon.sh /usr/sbin/zabbix_agentd /etc/zabbix/zabbix_agentd.conf /var/run/zabbix/zabbix_agentd.pid
startsecs=5
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:apache2]
command=/bin/bash -c 'source /etc/apache2/envvars && mkdir -p "$APACHE_RUN_DIR" "$APACHE_LOCK_DIR" "$APACHE_LOG_DIR" && exec /usr/sbin/apache2 -DFOREGROUND'
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
