PidFile=/var/run/zabbix/zabbix_agentd.pid
LogFile=/var/log/zabbix/zabbix_agentd.log
LogFileSize=10
# "app" is the test runner (started with "docker compose run --use-aliases"),
# which queries the agent with passive checks in the integration tests.
# Hostnames are resolved per connection; 2.4 has no CIDR ranges here.
Server=zabbix,127.0.0.1,app
ServerActive=127.0.0.1
Hostname=Zabbix server
# Global scripts run through script.execute (the "MP clear spool"
# remediation) are executed by the agent as remote commands.
EnableRemoteCommands=1
LogRemoteCommands=1
Include=/etc/zabbix/zabbix_agentd.d/
